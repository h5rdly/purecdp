name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # purecdp drives a REAL Chromium; on CI it runs headless without user
  # namespaces, so every launch needs --no-sandbox. Both vars matter:
  # CDPTestCase reads $PURECDP_LAUNCH_ARGS, the raw-launch e2e tests
  # (test_e2e / test_testing_e2e) read $PURECDP_E2E_ARGS. Setting both covers
  # every launch path. Without a browser these tests skip cleanly, so the leg
  # that installs one is what makes them actually run.
  # --enable-unsafe-swiftshader gives headless glibc Chrome a software WebGL
  # context so the stealth WebGL test verifies its spoof instead of skipping
  # (recent Chrome gates SwiftShader behind it). Harmless where WebGL is still
  # absent — that test then skips on its own.
  PURECDP_E2E_ARGS: --no-sandbox --enable-unsafe-swiftshader
  PURECDP_LAUNCH_ARGS: --no-sandbox --enable-unsafe-swiftshader

jobs:
  # Linux + Windows install Chrome for Testing; macOS installs Chromium via
  # Homebrew WITH --no-quarantine. (The runner's Chrome-for-Testing stalls
  # headless launch on macOS — a Gatekeeper-quarantine symptom: a quarantined
  # .app's first launch triggers a notarization check that hangs a headless
  # process. Stripping the quarantine xattr is the fix.) All three then run the
  # FULL suite incl. browser e2e. Fallback if macOS still misbehaves: set
  # PURECDP_NO_BROWSER on it (find_browser -> None) to run the pure suite only.
  test-standard:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # purecdp requires-python is >=3.14; 3.14t is the free-threaded build.
        python-version: ['3.14', '3.14t']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ endsWith(matrix.python-version, 't') }}

      # Linux/Windows: a known-good Chrome for Testing.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        if: runner.os != 'macOS'
        with:
          chrome-version: stable

      # macOS: Chromium via Homebrew, then strip the Gatekeeper quarantine xattr
      # so it launches headless without a first-launch notarization stall (the
      # cause of the flaky Chrome-for-Testing). Modern brew dropped the
      # --no-quarantine flag, so we remove the attribute explicitly.
      - name: Install Chromium (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask chromium
          sudo xattr -dr com.apple.quarantine "/Applications/Chromium.app" || true

      - name: Point purecdp at the browser
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "CDP_BROWSER=/Applications/Chromium.app/Contents/MacOS/Chromium" >> "$GITHUB_ENV"
          else
            echo "CDP_BROWSER=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          fi

      # Import + browser discovery — a clear one-line story.
      - name: Sanity — import and browser discovery
        shell: bash
        run: |
          export PYTHONPATH="$PWD/src"
          python -c "import purecdp; print('purecdp', purecdp.__version__, '| browser:', purecdp.find_browser())"

      # Actually launch + close the browser: turns a broken/stalling browser
      # (incl. a still-misbehaving macOS Chromium) into a fast, clear failure
      # here instead of a silent death in the test step.
      - name: Launch smoke
        shell: bash
        timeout-minutes: 3
        run: |
          export PYTHONPATH="$PWD/src"
          python -c "import asyncio, purecdp; loop = asyncio.new_event_loop(); b = loop.run_until_complete(purecdp.launch(extra_args=('--no-sandbox',))); loop.run_until_complete(b.aclose()); print('launch smoke: OK')"

      # Zero runtime deps: `discover` runs the whole suite straight from the
      # checkout. faulthandler.dump_traceback_later() is a PORTABLE watchdog —
      # after 600s it dumps EVERY thread's traceback and hard-exits, so a wedged
      # browser/test becomes a diagnosis on every OS (the mac/Windows legs had
      # none before — only Linux got `timeout -s ABRT`, so a hang there died
      # silently at the 20-min wall). verbosity=2 also names each test as it
      # starts. NEVER add -O — the tests use plain `assert`.
      - name: Run tests
        timeout-minutes: 20
        run: >-
          python -X faulthandler -c "import faulthandler, sys, unittest;
          faulthandler.dump_traceback_later(600, exit=True);
          sys.exit(not unittest.TextTestRunner(verbosity=2).run(
          unittest.defaultTestLoader.discover('tests')).wasSuccessful())"

  # Alpine / musl — apk's musl-native Chromium. The glibc Chrome-for-Testing
  # binary the standard leg uses cannot run here, which is exactly why this leg
  # earns its keep: it exercises purecdp against musl and a musl browser.
  test-alpine:
    name: Test (Alpine/musl)
    runs-on: ubuntu-latest
    container:
      image: python:3.14-alpine
    env:
      # tiny /dev/shm in containers makes Chromium abort mid-load; keep it off
      # the shm path in addition to the shared --no-sandbox.
      PURECDP_E2E_ARGS: --no-sandbox --disable-dev-shm-usage
      PURECDP_LAUNCH_ARGS: --no-sandbox --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v6

      # chromium + the runtime libs it pulls; a font (ttf-freefont) because
      # headless Chromium still aborts without one; git so actions/checkout uses
      # git rather than the slower REST download.
      - name: Install musl Chromium
        run: apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont git

      # No $CDP_BROWSER needed: apk puts `chromium` on PATH and find_browser()
      # picks it up. Confirm it here.
      - name: Sanity — import and browser discovery
        run: |
          PYTHONPATH="$PWD/src" python -c "import purecdp; print('purecdp', purecdp.__version__, '| browser:', purecdp.find_browser())"

      - name: Run tests
        timeout-minutes: 20
        run: python -X faulthandler -m unittest discover tests

  # FreeBSD — the FULL suite incl. browser e2e, against a real Chromium in the VM
  # (a non-Linux, non-glibc host). FreeBSD Chromium needs procfs + fdescfs
  # mounted and headless flags; the cross-origin OOPIF tests use 127.0.0.2/.3 as
  # distinct sites, which FreeBSD's lo0 doesn't route by default (Linux treats
  # all of 127/8 as loopback), so alias them. Root-needing setup goes in
  # `prepare` (guaranteed root); `run` just sets env and runs. Same recipe as
  # tests/freebsd_gauntlet.py (the local QEMU counterpart).
  test-freebsd:
    name: Test (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD VM
        timeout-minutes: 50   # chromium is a large pkg; the VM's download is slow
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # Point the ports repo at the QUARTERLY branch: chromium is reliably
            # built there, while `latest` (the VM default) intermittently drops
            # it after an upstream build break 
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD-ports.conf <<'EOF'
            FreeBSD-ports: { url: "pkg+https://pkg.freebsd.org/${ABI}/quarterly" }
            EOF
            pkg update -f
            pkg install -y python314
            # best-effort: if chromium is still unavailable, the browser e2e
            # tests skip (find_browser -> None) and the pure suite still runs.
            pkg install -y chromium || echo "::warning::chromium unavailable in pkg; FreeBSD browser e2e will skip"
            mount -t procfs proc /proc || true
            mount -t fdescfs fdesc /dev/fd || true
            ifconfig lo0 alias 127.0.0.2/32 || true
            ifconfig lo0 alias 127.0.0.3/32 || true
          run: |
            export PYTHONPATH=src   # src layout: the sanity import needs it (discover self-bootstraps)
            export CDP_BROWSER="$(command -v chrome || command -v chromium)"
            export PURECDP_E2E_ARGS="--no-sandbox --disable-dev-shm-usage --disable-gpu"
            export PURECDP_LAUNCH_ARGS="--no-sandbox --disable-dev-shm-usage --disable-gpu"
            python3.14 -c "import purecdp; print('purecdp', purecdp.__version__, '| browser:', purecdp.find_browser())" || exit 1
            python3.14 -X faulthandler -c "import faulthandler, sys, unittest; faulthandler.dump_traceback_later(600, exit=True); sys.exit(not unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests')).wasSuccessful())"
