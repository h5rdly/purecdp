[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"


[project]
name = "purecdp"
dynamic = ["version"]                                # purecdp.__version__
description = "Vanilla Python Chrome DevTools Protocol. Optional dependencies for accelerated performance"
readme = "Readme.md"   # exact on-disk case — GitHub's Linux runner is case-sensitive
license = "0BSD"
requires-python = ">=3.14"


keywords = [
    "cdp", "chrome-devtools-protocol", "chromium", "browser", "devtools", "browser-automation", 
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.optional-dependencies]
faster = [
    "orjson>=3.11",                                # wire JSON dumps/loads
    "pybase64>=1.4.3",                             # screenshot/PDF/body base64
    "uvloop>=0.22; platform_system != 'Windows'",  # faster event loop (POSIX)
    "winloop>=0.6; platform_system == 'Windows'",  # faster event loop (Windows)
]

[project.urls]
Homepage = "https://github.com/h5rdly/purecdp"

[project.entry-points.pytest11]
purecdp = "purecdp.testing.pytest_plugin"

[tool.setuptools.dynamic]
version = { attr = "purecdp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purecdp = ["py.typed"]
